name: Monitor Railway Deploy

on:
  push:
    branches: [main]  # troca se sua branch principal for outra

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Verifica se o app está no ar
        env:
          APP_URL: https://amhpdf.b4strategy.com.br/
        run: |
          echo "🚀 Deploy iniciado — commit ${{ github.sha }}"
          echo "⏳ Aguardando o Railway publicar a nova versão..."
          sleep 30

          # Tenta acessar a URL pública do app por até ~5 minutos.
          # Se o app responder HTTP 200, está no ar e o deploy deu certo.
          for i in {1..20}; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$APP_URL" || echo "000")
            echo "[$i/20] HTTP $CODE — $APP_URL"

            if [ "$CODE" = "200" ]; then
              echo "✅ App no ar! (HTTP 200)"
              exit 0
            fi

            sleep 15
          done

          echo "❌ App não respondeu HTTP 200 a tempo (último código: $CODE)"
          exit 1
